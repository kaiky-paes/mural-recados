<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <!-- responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Recados</title>
    <!-- ctrl + ; : atalho para comentar no vscode -->
    <!-- icone na guia (png ou icon) -->
    <link rel="shortcut icon" href="img/icone.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            padding: 24px;
            text-align: center;
            background: #e30613;
            color: #fff;
        }

        main {
            margin: 28px auto;
            width: min(700px, 92%);
        }

        form,
        article {
            margin-bottom: 14px;
            padding: 18px;
            background: #fff;
            border-radius: 8px;
        }

        input,
        textarea,
        button {
            margin: 8px 0 14px;
            padding: 11px;
            width: 100%;
            font: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            font-weight: bold;
            background: #e30613;
            color: #fff;
            border: 0;
            cursor: pointer;
        }

        button:hover {
            background: #b9040e;
        }

        h2 {
            margin-top: 28px;
        }

        article {
            border-left: 5px solid #e30613
        }

        article p {
            margin-bottom: 0;
        }

        #aviso {
            min-height: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- header>h1{Mural de Recados}+p{Front + Java + JDBC + MySQL} -->
    <header>
        <h1>Mural de Recados</h1>
        <p>Front + Java + JDBC + MySQL</p>
    </header>

    <main>
        <form id="form-recado">
            <label for="autor">Nome</label>
            <input id="autor" name="autor" maxlenght="80" required>
            <label for="message">Recado</label>
            <textarea id="message" name="message" maxlength="255"></textarea>
            <button type="submit">Publicar recado</button>
        </form>
        <p id="aviso"></p>
        <h2>Recados publicados</h2>
        <section id="lista-recados"></section>
    </main>

    <script>
        const formulario = document.querySelector("#form-recado")
        const lista = document.querySelector("#lista-recados")
        const aviso = document.querySelector("#aviso")

        async function carregarRecados() {
            const resposta = await fetch("/api/recados")
            const recados = await resposta.json()
            lista.innerHTML = ""

            for (const recado of recados) {
                const cartao = document.createElement("article")
                const autor = document.createElement("strong")
                const message = document.createElement("p")

                autor.textContent = recado.autor
                message.textContent = recado.message
                cartao.append(autor, message)
                lista.appendChild(cartao)
            }

            formulario.addEventListener("submit", async function (evento) {
                evento.preventDefault()
                aviso.textContent = "Salvando..."

                const dados = new URLSearchParams(new FormData(formulario))
                const resposta = await fetch("/api/recados", {
                    method: "POST",
                    body: dados
                })
                if (resposta.ok) {
                    formulario.reset()
                    aviso.textContent = "Recado cadastrado com sucesso!"
                    await carregarRecados()
                } else {
                    aviso.textContent = "Não foi possível cadastrar o recado!"
                }
            })
        }
        carregarRecados()
    </script>
</body>

</html>
